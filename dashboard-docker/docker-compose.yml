services:
  linux-dashboard:
    build: .
    container_name: linux-dashboard
    network_mode: host
    pid: "host"
    # Least-Privilege statt `privileged: true`: nur die für nsenter (Host-Mount-
    # Namespace) nötigen Zusatz-Capabilities. Docker-Default-Caps (CHOWN,
    # DAC_OVERRIDE, KILL, SETUID/SETGID, FOWNER, SYS_CHROOT, MKNOD …) decken
    # Benutzer-/Prozessverwaltung bereits ab. seccomp/apparmor unconfined, damit
    # setns/mount nicht vom Default-Profil blockiert wird.
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
      - DAC_READ_SEARCH
      - NET_ADMIN
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    restart: unless-stopped
    volumes:
      # App-Code + Frontend live gemountet: Änderungen greifen per `up -d` (Recreate),
      # kein Image-Rebuild nötig.
      - ./server.py:/app/server.py:ro
      - ./dashboard:/app/dashboard:ro
      - ./static:/app/static:ro
      - /sys:/sys:ro
      # VM-Verwaltung (libvirt/QEMU). Ohne libvirt auf dem Host bleiben nur die
      # VM-Funktionen inaktiv, der Rest läuft normal weiter.
      - /run/libvirt:/run/libvirt
      # Login gegen die echten Host-Benutzer (/etc/shadow)
      - /etc/passwd:/etc/passwd:ro
      - /etc/shadow:/etc/shadow:ro
      - /etc/group:/etc/group:ro
      # Browser-Sessions + Docker-Verwaltung
      - /var/run/docker.sock:/var/run/docker.sock
      # Persistente Daten (Sessions, Browser-Sitzungen, Einstellungen)
      - /var/lib/linux-dashboard:/data
    environment:
      - PYTHONUNBUFFERED=1
      # Direkter Zugriff ist per Default nur von localhost / Docker-Bridges
      # (127./172./10.) erlaubt — Ursprungs-Setup lief hinter einem Cloudflare-
      # Tunnel. Für direkten LAN-/IP-Zugriff die erlaubten Präfixe erweitern:
      #   "*"              = jeder Zugriff erlaubt
      #   "192.168.,100."  = nur diese Präfixe zusätzlich erlauben
      - DASHBOARD_ALLOWED_NETS=*
      # Port des Dashboards (Standard 8420)
      # - DASH_PORT=8420
