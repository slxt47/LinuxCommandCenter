services:
  linux-dashboard:
    build: .
    image: linux-dashboard:local
    container_name: linux-dashboard
    network_mode: host
    pid: "host"
    # Least-Privilege statt `privileged: true`: nur die für nsenter (Host-Mount-
    # Namespace) nötigen Zusatz-Capabilities. Docker-Default-Caps (CHOWN,
    # DAC_OVERRIDE, KILL, SETUID/SETGID, FOWNER, SYS_CHROOT, MKNOD …) decken
    # Benutzer-/Prozessverwaltung bereits ab. seccomp/apparmor unconfined, damit
    # setns/mount nicht vom Default-Profil blockiert wird.
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
      - DAC_READ_SEARCH
      - NET_ADMIN
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    restart: unless-stopped
    volumes:
      # App-Code + Frontend live gemountet: Änderungen greifen per `up -d` (Recreate),
      # kein Image-Rebuild nötig.
      - ./server.py:/app/server.py:ro
      - ./dashboard:/app/dashboard:ro
      - ./static:/app/static:ro
      - /sys:/sys:ro
      # libvirt-Socket für VM-Verwaltung. Ohne libvirt bleibt das Verzeichnis
      # leer und die VM-Funktionen inaktiv; der Rest läuft normal.
      - /run/libvirt:/run/libvirt
      # Host-Benutzer für den Dashboard-Login (crypt gegen /etc/shadow).
      - /etc/passwd:/etc/passwd:ro
      - /etc/shadow:/etc/shadow:ro
      - /etc/group:/etc/group:ro
      # Docker-Steuerung (Docker-Reiter, Browser-Sessions)
      - /var/run/docker.sock:/var/run/docker.sock
      # Persistente Daten (Sessions, VM-Besitz, auth.log für fail2ban)
      - /var/lib/linux-dashboard:/data
    environment:
      - PYTHONUNBUFFERED=1
    # Server-spezifische Einstellungen (erlaubte Netze, Superadmins, Port …).
    # Legt install.sh an; Beschreibung aller Schlüssel siehe Datei bzw. README.
    env_file:
      - /etc/linux-dashboard/dashboard.env
