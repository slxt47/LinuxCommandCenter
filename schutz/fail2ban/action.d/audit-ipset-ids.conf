# linux-dashboard-schutz -- wie audit-ipset.conf, aber eigene Sets ids_ban4/ids_ban6
# fuer den IDS-Waechter. Die Firewall matcht diese Sets in BEIDE Richtungen
# (Quelle UND Ziel). Parameter muessen zu waechter-firewall.sh passen.
[Definition]
actionstart = ipset create <ipmset> hash:ip timeout 0 <familyopt> maxelem 1000000 -exist
actionflush = ipset flush <ipmset>
actionstop = <actionflush>
actionban   = ipset add <ipmset> <ip> timeout 0 -exist
actionunban = ipset del <ipmset> <ip> -exist
[Init]
ipmset = ids_ban4
familyopt =
[Init?family=inet6]
ipmset = ids_ban6
familyopt = family inet6
