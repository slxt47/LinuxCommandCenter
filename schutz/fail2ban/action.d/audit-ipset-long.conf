# linux-dashboard-schutz -- wie audit-ipset, aber in EIGENE Sets f2b_long4 / f2b_long6.
#
# Warum nicht ssh_ban4: audit-ipset loescht beim Unban die IP aus dem Set,
# auch wenn eine andere Jail sie noch sperrt (keine Referenzzaehlung). Eine
# lange Sperre im gemeinsamen Set wuerde vom 1-h-Unban einer schnellen Jail
# mit aufgehoben. Getrennte Sets = getrennte Lebensdauer.

[INCLUDES]
before = audit-ipset.conf

[Init]
ipmset = f2b_long4
familyopt =

[Init?family=inet6]
ipmset = f2b_long6
familyopt = family inet6
