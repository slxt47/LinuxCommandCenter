# linux-dashboard-schutz -- sperrt ganze /24-Netze im Set f2b_net4 (hash:net).
# Gegenstueck zum Filter mail-subnet24.
#
# Der Filter liefert als Fehler-ID die ersten drei Oktette MIT Punkt
# (z. B. "192.0.2."), weil eine Regex keinen Text erfinden kann. Hier wird
# daraus "192.0.2.0/24". Nur IPv4.

[Definition]

actionstart = ipset create f2b_net4 hash:net family inet timeout 0 -exist
actionflush = ipset flush f2b_net4
# wie audit-ipset: nur leeren, nicht zerstoeren (Set ist aus iptables referenziert)
actionstop  = <actionflush>

actionban   = ipset add f2b_net4 <ip>0/24 timeout 0 -exist
actionunban = ipset del f2b_net4 <ip>0/24 -exist

[Init]
