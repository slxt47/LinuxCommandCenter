# linux-dashboard-schutz -- Dauersperre per ipset perm_ban4/perm_ban6.
#
# Eigene Sets statt ssh_ban4/6: dort loescht jedes Unban einer Kurzsperre die
# IP fuer ALLE Jails. Eine Dauersperre im selben Set waere nach dem Ablauf der
# ersten Kurzsperre derselben IP verschwunden.
#
# actionstop leert das Set bewusst NICHT: die Dauersperren sollen auch
# waehrend eines fail2ban-Neustarts gelten. fail2ban stellt sie beim Start
# aus seiner Datenbank wieder her (bantime -1 wird nie gepurgt).

[Definition]
actionstart = ipset create <ipmset> hash:ip family <ipfamily> timeout 0 maxelem 1000000 -exist
actionflush = ipset flush <ipmset>
actionstop  =
actionban   = ipset add <ipmset> <ip> timeout 0 -exist
actionunban = ipset del <ipmset> <ip> -exist

[Init]
ipmset   = perm_ban4
ipfamily = inet

[Init?family=inet6]
ipmset   = perm_ban6
ipfamily = inet6
