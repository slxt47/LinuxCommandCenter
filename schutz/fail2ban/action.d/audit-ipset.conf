# linux-dashboard-schutz -- fail2ban-Action: schreibt Sperren in die ipsets ssh_ban4/ssh_ban6.
#
# Warum ipset statt der Standard-iptables-Action: Eine Firewall-Kette, die
# Port 22 vorne bedingungslos akzeptiert, beendet dort die Filterung - die von
# fail2ban selbst angelegten f2b-*-Ketten weiter hinten werden fuer SSH nie
# erreicht. Die Sets werden stattdessen VOR jedem ACCEPT gematcht
# (waechter-firewall.sh bzw. eine eigene Firewall mit FIREWALL=aus).
#
# Die Action legt bewusst KEINE iptables-Regel an - das Regelwerk gehoert der
# Firewall. Datei gehoert dem Schutz-Paket des Linux Dashboards (Updates ueberschreiben sie).

[Definition]

# -exist, damit ein Neustart nicht an einem bereits vorhandenen Set scheitert.
actionstart = ipset create <ipmset> hash:ip timeout <default-ipsettime> <familyopt> -exist

actionflush = ipset flush <ipmset>

# Nur leeren, NICHT destroy: das Set ist aus iptables referenziert. fail2ban
# stellt aktive Sperren beim naechsten Start aus seiner Datenbank wieder her.
actionstop = <actionflush>

actionban   = ipset add <ipmset> <ip> timeout <ipsettime> -exist
actionunban = ipset del <ipmset> <ip> -exist

[Init]

# 0 = Set unterstuetzt Timeouts, verfaellt aber nicht von selbst.
# Ablauf und Unban verwaltet fail2ban ueber bantime.
default-ipsettime = 0
ipsettime = 0

ipmset = ssh_ban4
familyopt =

[Init?family=inet6]

ipmset = ssh_ban6
familyopt = family inet6
