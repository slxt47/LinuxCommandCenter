# linux-dashboard-schutz -- sperrt die IP am Cloudflare-Rand (IP-Liste + WAF-Regel).
#
# Fuer alles hinter einem Cloudflare-Tunnel/-Proxy ist das die EINZIGE
# wirksame Sperre: ein ipset auf dem Host sieht den Angreifer nie.
#
# Die Arbeit macht /usr/local/sbin/cf-ban.sh. Der Aufruf laeuft im
# Hintergrund und liefert immer 0: eine langsame oder nicht erreichbare
# Cloudflare-API darf weder fail2ban blockieren noch den Ban scheitern lassen.
# Ohne Zugangsdaten in /etc/fail2ban/cloudflare.local ist die Action still.

[Definition]

actionstart =
actionstop  =
actioncheck =

actionban   = /usr/local/sbin/cf-ban.sh add <ip> <name> >/dev/null 2>&1 &
actionunban = /usr/local/sbin/cf-ban.sh del <ip> <name> >/dev/null 2>&1 &

[Init]

# Kein erneutes Sperren fuer Bans, die fail2ban beim Start aus der Datenbank
# wiederherstellt (sonst bei jedem Neustart Dutzende API-Aufrufe).
norestored = 1
