# linux-dashboard-schutz -- Push bei einer Dauersperre.
# norestored: nach einem Neustart wiederhergestellte Sperren melden nicht neu.

[Definition]
actionstart =
actionstop  =
actioncheck =
actionban   = /usr/local/sbin/f2b-dauersperre-notify.sh "<ip>" "<name>" "<herkunft>" "<prio>" >/dev/null 2>&1 &
actionunban =

[Init]
herkunft   = <name>
prio       = default
norestored = 1
