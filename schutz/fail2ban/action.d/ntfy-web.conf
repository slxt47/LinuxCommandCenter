# linux-dashboard-schutz -- ntfy-Push bei gesperrtem Web-/Mail-Login, mit Name und
# Link der angegriffenen Anwendung. Jede Jail setzt beides ueber ihre
# action-Zeile, z. B.:
#     action = ntfy-web[appname="Nextcloud", appurl="https://cloud.example.com"]
#
# Die Nachricht steht BEWUSST auf einer Zeile: fail2ban reicht den Befehl an
# /bin/sh weiter, eingebettete Zeilenumbrueche zerreissen dort die
# Anfuehrungszeichen (die Push bliebe aus, der Ban liefe durch).

[Definition]

actionstart =
actionstop  =
actioncheck =

actionban = /usr/local/sbin/waechter-push -t "rotating_light,lock" -c "<appurl>" "Login gesperrt: <appname>" high "IP <ip> nach <failures> Fehlversuchen gesperrt. | Dienst: <appname> | Jail: <name> | Server: $(hostname) | Zeit: $(date "+%%Y-%%m-%%d %%H:%%M:%%S %%Z")" >/dev/null 2>&1 &

actionunban =

[Init]

appname = <name>
appurl  =

norestored = 1
