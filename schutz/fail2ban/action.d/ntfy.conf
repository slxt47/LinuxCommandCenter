# linux-dashboard-schutz -- ntfy-Push bei einer Sperre (Zugangsdaten in
# /etc/linux-dashboard/schutz.conf, nicht hier). Laeuft im Hintergrund und
# liefert immer 0: ein nicht erreichbarer ntfy-Server laesst den Ban nicht
# scheitern. Literales % ist als %% geschrieben (fail2ban-Interpolation).
[Definition]
actionstart =
actionstop =
actioncheck =
actionban = /usr/local/sbin/waechter-push -t "rotating_light,no_entry" "Fail2ban Ban [<name>]" high "Banned IP <ip> in jail <name> on $(hostname) at $(date '+%%Y-%%m-%%d %%H:%%M:%%S %%Z')" >/dev/null 2>&1 &
actionunban =
[Init]
# Keine Push fuer Sperren, die beim Start aus der Datenbank wiederhergestellt
# werden - sonst prasseln nach jedem Neustart Dutzende Meldungen herein.
norestored = 1
