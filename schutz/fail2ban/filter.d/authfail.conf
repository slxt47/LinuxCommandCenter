# linux-dashboard-schutz -- allgemeiner Filter fuer eigene Anwendungen, die
# Fehlanmeldungen in diesem einfachen Format protokollieren:
#
#   2026-01-31 12:00:00 <app> AUTHFAIL user=<name> ip=<ip> [schluessel=wert ...]
#
# Regeln fuer die schreibende Anwendung (sonst Log-Injection):
#   - Benutzername nur [A-Za-z0-9._@+-], alles andere ersetzen
#   - IP vor dem Schreiben validieren (bei Proxy/Tunnel die echte Besucher-IP,
#     z. B. CF-Connecting-IP, aber nur von einer vertrauenswuerdigen Gegenstelle)
# Jail-Name nach dem Schema authfail-<app>, dann zaehlt sie fuer die
# Web-Dauersperre mit.

[Definition]

failregex = ^\s*[\w.-]+ AUTHFAIL user=\S* ip=<HOST>(?:\s+[\w.-]+=\S*)*\s*$

ignoreregex =

datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S
