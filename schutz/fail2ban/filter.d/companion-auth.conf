# fail2ban-Filter fuer die KI-Begleiterin (Zeilen aus data/auth.log der App)
# Beispiel: 2026-09-23 21:40:11 companion AUTHFAIL user=admin ip=198.51.100.7 detail=badpass
[Definition]
failregex = ^\s*companion AUTHFAIL user=\S* ip=<HOST> detail=\S+\s*$
ignoreregex =
datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S
