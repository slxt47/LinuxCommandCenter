# Fehlgeschlagene Anmeldungen am Linux Command Center.
#
# Quelle: /var/lib/linux-dashboard/auth.log, geschrieben von
# dashboard/auth.py:log_auth_event(). Die dort protokollierte Adresse ist
# bereits die echte Besucher-IP (CF-Connecting-IP), nicht die des Tunnels.
#
# Zeilenformat:
#   2026-09-01 05:07:21 dashboard AUTHFAIL user=hacker ip=198.51.100.77 detail=badcreds

[Definition]

failregex = ^\s*dashboard AUTHFAIL user=\S* ip=<HOST> detail=\S+\s*$

ignoreregex =

datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S
