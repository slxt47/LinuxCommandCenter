# Dauersperre fuer Web-Logins (eingerichtet 08.10.2026) -- wie dauersperre.conf,
# aber fuer die Jails hinter dem Cloudflare-Tunnel. Die Sperre wirkt dort nur am
# Cloudflare-Rand (Action cf-block), nicht per ipset.
#
# yoga-auth ist bewusst NICHT enthalten (Kundenlogins der Yoga-Plattform; eine
# dauerhafte Sperre am Cloudflare-Rand traefe bei Mobilfunk-CGNAT auch Dritte).
# Aufnahme ist eine bewusste Entscheidung -- dann hier "|yoga-auth" ergaenzen.

[INCLUDES]
before = dauersperre.conf

[Definition]
# roundcube und jede Jail roundcube-<name> zaehlen mit; ebenso authfail-<name>.
# Eigene Ergaenzung: filter.d/dauersperre-web.local
_jails = dashboard-auth|companion-auth|demo-qbs-auth|nextcloud-auth|ntfy-auth|pxe-auth|roundcube(?:-[\w-]+)?|authfail-[\w-]+
