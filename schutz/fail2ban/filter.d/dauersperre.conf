# Dauersperre (Linux-Dashboard-Schutz)
#
# Zaehlt die Ban-Meldungen anderer Jails in /var/log/fail2ban.log. Die Jail
# [dauersperre] sperrt eine IP dauerhaft, sobald sie innerhalb von findtime
# zum dritten Mal gesperrt wurde (maxretry = 3).
#
# Gezaehlt werden NUR die in _jails genannten Jails. Bewusst NICHT:
#   postfix*   -- Postfix prueft Passwoerter ueber Dovecot; jede Postfix-Sperre
#                 faellt zeitgleich mit der dovecot-*-Sperre derselben IP
#                 und wuerde doppelt zaehlen.
#   sshd       -- sperrt praktisch immer zeitgleich mit sshd-invalid
#                 (Doppelzaehlung).
#   dauersperre* -- die eigenen Meldungen.
# "Restore Ban" (nach Neustart) und "Increase Ban" zaehlen nicht, weil die
# Regex direkt hinter der Jail-Klammer das Wort "Ban" verlangt.
# dovecot und jede Jail dovecot-<name> zaehlen mit (je Mailserver eine Jail).
# Eigene Jails ergaenzen: filter.d/dauersperre.local mit
#   [Definition]
#   _jails = sshd-invalid|dovecot(?:-[\w-]+)?|mail-unknownuser|meine-jail

[INCLUDES]
before = common.conf

[Definition]
_daemon = (?:fail2ban(?:-server|\.actions)\s*)
_jails = sshd-invalid|dovecot(?:-[\w-]+)?|mail-unknownuser
failregex = ^%(__prefix_line)s(?:\s*fail2ban\.actions\s*%(__pid_re)s?:\s+)?NOTICE\s+\[(?:%(_jails)s)\]\s+Ban\s+<HOST>\s*$
datepattern = ^{DATE}
ignoreregex =
