# Fehlgeschlagene Admin-Anmeldungen an Demo-QBS.
#
# Quelle: /var/lib/demo-qbs/auth.log, geschrieben von demoqbs/auth.py:log_auth().
# Die Adresse ist bereits die echte Besucher-IP (CF-Connecting-IP), nicht der Tunnel.
#
# Zeilenformat:
#   2026-09-17 19:14:54 demo-qbs AUTHFAIL user=admin ip=203.0.113.5 detail=badcreds

[Definition]

failregex = ^\s*demo-qbs AUTHFAIL user=\S* ip=<HOST> detail=\S+\s*$

ignoreregex =

datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S
