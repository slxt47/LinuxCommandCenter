# IDS-Waechter (Security-Update 09.10.2026). Liest /var/log/ids-watch.log.
# Die IP steht an fester Stelle direkt hinter der Art und wird vom Waechter
# per ipaddress validiert; der Rest der Zeile wird nicht ausgewertet.
[Definition]
art = IDS-ANGRIFF
failregex = ^ <art> <HOST> 
ignoreregex =
datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S
