# fail2ban-Filter (Linux-Dashboard-Schutz): Anmeldeversuche mit
# NICHT EXISTIERENDEN Benutzernamen an Dovecot - egal ob ueber IMAP (993)
# oder ueber SMTP-AUTH (465/587, Postfix fragt Dovecot per SASL).
#
# Warum gerade dieses Muster: Echte Angriffswellen gegen einen Mailserver
# (verteilte Botnetze, je IP nur alle paar Stunden ein Versuch) haben AUSSCHLIESSLICH nackte bzw. erfundene Namen probiert
# (admin, test, info, ...). Ein legitimer Mail-Client mit veraltetem Passwort
# erzeugt dagegen "Password mismatch" fuer ein EXISTIERENDES Konto und wird
# von diesem Filter nicht gezaehlt -> kein Wochen-Bann fuer den eigenen
# Abrufdienst nach einer Passwortaenderung.
#
# Erkannt werden (Beispiele aus den echten Logs):
#  dovecot: auth: passwd-file(info,92.118.39.223): unknown user (SHA1 of given password: 59bd0a)
#  dovecot: auth: passwd-file(audit@x,10.10.1.2,<nzQn3AFchLIKCgEC>): unknown user (...)
#  dovecot: auth: plain(?,45.148.10.5): Empty username
#  dovecot: auth: login(?,1.2.3.4): Username character disallowed by auth_username_chars: 0x21 (username: E!?)
# NICHT erkannt (absichtlich): LMTP-/Empfaenger-Pruefungen ohne Client-IP
#  dovecot: auth: passwd-file(catchalladdresscheck@example.com): unknown user

[INCLUDES]
before = common.conf

[Definition]
_daemon = (?:dovecot(?:-auth)?|auth)
prefregex = ^%(__prefix_line)s(?:dovecot: )?auth(?:-worker)?(?:\([^\)]+\))?: <F-CONTENT>.+</F-CONTENT>$

failregex = ^[a-z\-]{3,15}\(<F-USER>[^,\)]*</F-USER>,<HOST>(?:,\S*)?\): (?:unknown user\b|Empty username\b|Username character disallowed by auth_username_chars\b)

ignoreregex =

datepattern = {^LN-BEG}
