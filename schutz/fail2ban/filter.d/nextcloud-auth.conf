# Fehlgeschlagene Nextcloud-Anmeldungen.
#
# Quelle: /opt/nextcloud/config/nextcloud.log (JSON, eine Zeile je Ereignis).
# Das Log liegt bewusst dort und nicht unter /mnt/hetzner/nextcloud/data:
# jenes Verzeichnis ist eine CIFS-Storagebox, auf der inotify nicht
# funktioniert und Polling ueber das Netz laeuft.
#
# Die Adresse ist seit dem Setzen von trusted_proxies + forwarded_for_headers
# in config.php die echte Besucher-IP.
#
# Erfasst wird sowohl der klassische Fehl-Login als auch das Zuschlagen der
# Nextcloud-eigenen Bruteforce-Bremse.

[Definition]

# 09.10.2026: Nextcloud 32.0.15 schreibt "scriptName" zwischen url und message -> alte
# Regex traf nichts mehr (Audit M21). remoteAddr steht vor allen Feldern, die ein
# Angreifer beeinflusst; eingeschleuste Anfuehrungszeichen sind JSON-escaped.
failregex = "remoteAddr":"<HOST>",.*"message":"Login failed:
            "remoteAddr":"<HOST>",.*"message":"Bruteforce attempt from \\"[^"]*\\" detected

ignoreregex =

datepattern = "time":"%%Y-%%m-%%dT%%H:%%M:%%S%%z
