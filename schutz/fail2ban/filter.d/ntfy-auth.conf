# Abgewiesene Zugriffe auf den ntfy-Server.
#
# Quelle: /opt/ntfy/lib/ntfy.log (JSON). ntfy protokolliert abgelehnte
# Anmeldungen erst ab log-level=debug; deshalb steht im docker-compose.yml
# NTFY_LOG_LEVEL=debug. NTFY_BEHIND_PROXY=true sorgt dafuer, dass visitor_ip
# die echte Adresse ist und nicht die des cloudflared-Containers.
#
# 401 = falsche Zugangsdaten, 403 = gueltig angemeldet, aber kein Zugriff auf
# das Topic. Beides ist bei wiederholtem Auftreten ein Probierversuch.
#
# Beispielzeile:
#   {"time":"...","message":"Connection closed with HTTP 401 (ntfy error 40101)",
#    "visitor_ip":"198.51.100.11","http_status":401,"error":"unauthorized"}

[Definition]

failregex = "http_status":40[13],.*"visitor_ip":"<HOST>"

ignoreregex =

datepattern = "time":"%%Y-%%m-%%dT%%H:%%M:%%S.%%f%%z
