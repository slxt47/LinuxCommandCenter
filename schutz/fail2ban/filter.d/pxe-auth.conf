# Fehlgeschlagene Anmeldungen an der PXE-GUI.
#
# Quelle: /srv/pxe-docker/opt-pxe-gui/auth.log, geschrieben von _log_auth()
# in app.py. Die Datei liegt im gemounteten Datenverzeichnis, damit der Host
# mitlesen kann - im Container-Dateisystem waere sie fuer fail2ban unsichtbar.
#
# Zeilenformat:
#   2026-09-01 05:18:44 pxe-gui AUTHFAIL user=hacker ip=198.51.100.99

[Definition]

failregex = ^\s*pxe-gui AUTHFAIL user=\S* ip=<HOST>\s*$

ignoreregex =

datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S
