# Fail2Ban-Filter: Roundcube-Webmail hinter dem Cloudflare Tunnel
#
# Liest logs/userlogins.log (log_logins=true). Roundcube schreibt dort
#   [02-Sep-2026 04:58:21 +0000]: <e04fabb0> Failed login for NAME from 10.0.1.4 (X-Real-IP: 1.2.3.4) in session e04fabb074a72bf2 (error: 1)
# Vorne steht REMOTE_ADDR (der cloudflared-Container), die echte Adresse in
# der Klammer. Die Klammer enthaelt NUR X-Real-IP, weil
# config/99-fail2ban.inc.php X-Forwarded-For verwirft (siehe dort).
#
# Zum Muster (Audit 02.09.2026):
# - Der Benutzername ist frei waehlbar und darf Leerzeichen enthalten. Ein
#   \S+ an dieser Stelle liess sich mit "a b" als Name einfach umgehen.
#   Deshalb ".+" - und der Rest der Zeile ist mit $ am Ende verankert.
#   Ein Name wie "x from 1.1.1.1 (X-Real-IP: 9.9.9.9) in session a (error: 0)"
#   landet damit im ".+" und nicht in <HOST>: das gierige .+ greift die
#   LETZTE "from ... in session ... (error: N)"-Gruppe, und die schreibt
#   Roundcube selbst.
# - Session-ID und Fehlercode stammen vom Server, nicht vom Client.
#
# Fail2ban entfernt den Zeitstempel VOR dem Mustervergleich; die Muster
# beginnen deshalb erst bei "<session>".

[Definition]

failregex = ^\s*(?:<\w+>\s+)?Failed login for .+ from \S+ \(X-Real-IP: <HOST>\) in session \w+ \(error: \d+\)\s*$
            ^\s*(?:<\w+>\s+)?Failed login for .+ from <HOST> in session \w+ \(error: \d+\)\s*$

ignoreregex =

datepattern = ^\[%%d-%%b-%%Y %%H:%%M:%%S %%z\]:
