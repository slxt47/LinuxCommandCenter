# Fehlgeschlagene Anmeldungen der Yoga-Plattform.
#
# Quelle: /root/yoga-platform/app/storage/logs/auth.log, geschrieben vom
# Listener App\Listeners\ProtokolliereFehlanmeldung (Event Auth\Events\Failed).
# Bewusst eine eigene Datei statt laravel.log: dort wechselt das Format und
# mehrzeilige Stacktraces machen zeilenweise Muster unzuverlaessig.
#
# Erfasst Kundenlogin UND Filament-Adminpanel - beide gehen durch Laravels
# Auth, beide loesen dasselbe Event aus.
#
# Zeilenformat:
#   2026-09-01 05:16:38 yoga AUTHFAIL user=x@example.com ip=198.51.100.88 guard=web

[Definition]

failregex = ^\s*yoga AUTHFAIL user=\S* ip=<HOST> guard=\S+\s*$

ignoreregex =

datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S
