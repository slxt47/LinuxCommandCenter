<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vault</title>
  <script type="importmap" nonce="__NONCE__">
    { "imports": { "hash-wasm": "./vendor/hash-wasm.esm.js" } }
  </script>
  <style>
    :root {
      --bg-void:#06080d; --bg-deep:#0b0f18; --bg-surface:#111827; --bg-card:#151d2e;
      --bg-elevated:#1a2438; --bg-input:#0d1320;
      --border-dim:#1e293b; --border-mid:#2a3a52; --border-glow:#334766;
      --text-primary:#e2e8f0; --text-secondary:#8b9dc3; --text-muted:#4a5e80;
      --accent:#00e87b; --accent-dim:#00c968; --accent-glow:rgba(0,232,123,.15); --accent-ghost:rgba(0,232,123,.06);
      --cyan:#00d4ff; --blue:#3b82f6; --amber:#f59e0b; --red:#ef4444; --purple:#a855f7; --orange:#f97316;
      --radius-sm:6px; --radius-md:10px; --radius-lg:14px; --radius-xl:20px;
      --font-mono:'JetBrains Mono','Fira Code',monospace;
      --font-sans:'Space Grotesk',system-ui,sans-serif;
    }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg-void); color:var(--text-primary); font:14px/1.5 var(--font-sans); }
    ::-webkit-scrollbar { width:8px; height:8px; }
    ::-webkit-scrollbar-thumb { background:var(--border-mid); border-radius:3px; }
    .wrap { max-width:880px; margin:0 auto; padding:20px 16px; }
    h1 { font-size:20px; font-weight:600; }
    h2 { font-size:16px; font-weight:600; margin-bottom:14px; }
    .muted { color:var(--text-secondary); }
    .dim { color:var(--text-muted); font-size:12px; }
    .pad { padding:16px; }

    /* Screens / Cards */
    .screen { display:flex; justify-content:center; padding-top:7vh; }
    .card { background:var(--bg-card); border:1px solid var(--border-dim); border-radius:var(--radius-lg);
            padding:24px; max-width:440px; width:100%; box-shadow:0 8px 40px rgba(0,0,0,.35); }
    .card.wide { max-width:600px; }
    .brand { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
    .brand .logo { width:34px; height:34px; border-radius:9px; display:grid; place-items:center;
      background:linear-gradient(135deg,var(--accent),var(--cyan)); color:var(--bg-void); }

    /* Fields */
    .field { display:block; margin:14px 0; }
    .field > span { display:block; font-size:12px; color:var(--text-secondary); margin-bottom:5px;
      text-transform:uppercase; letter-spacing:.5px; }
    input,textarea,select { width:100%; padding:11px 12px; background:var(--bg-input);
      border:1px solid var(--border-mid); border-radius:var(--radius-md); color:var(--text-primary);
      font:inherit; outline:none; transition:border-color .15s; }
    input:focus,textarea:focus { border-color:var(--accent-dim); box-shadow:0 0 0 3px var(--accent-ghost); }
    textarea { min-height:70px; resize:vertical; }
    .mono { font-family:var(--font-mono); }

    /* Buttons */
    .btn { padding:10px 15px; border:1px solid var(--border-mid); background:var(--bg-elevated);
      color:var(--text-primary); border-radius:var(--radius-md); cursor:pointer; font:inherit;
      display:inline-flex; align-items:center; gap:7px; transition:all .15s; white-space:nowrap; }
    .btn:hover { border-color:var(--border-glow); background:var(--bg-surface); }
    .btn.primary { background:var(--accent); border-color:var(--accent); color:var(--bg-void); font-weight:600;
      box-shadow:0 0 18px var(--accent-glow); }
    .btn.primary:hover { background:var(--accent-dim); }
    .btn.danger { background:transparent; border-color:rgba(239,68,68,.4); color:var(--red); }
    .btn.danger:hover { background:rgba(239,68,68,.1); }
    .btn.ghost { background:transparent; border-color:transparent; padding:7px; }
    .btn.ghost:hover { background:var(--bg-elevated); }
    .btn.sm { padding:6px 10px; font-size:12px; }
    .btn[disabled] { opacity:.5; cursor:not-allowed; }
    .btn.icon { padding:8px; }
    .link { color:var(--accent); cursor:pointer; background:none; border:none; font:inherit; padding:0; }
    .row { display:flex; align-items:center; gap:8px; }
    .row.mt { margin-top:14px; }
    .grow { flex:1; }

    /* Topbar */
    .topbar { display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
    .topbar h1 { display:flex; align-items:center; gap:9px; }
    .search-wrap { position:relative; margin-bottom:14px; }
    .search-wrap input { padding-left:38px; }
    .search-wrap svg { position:absolute; left:12px; top:50%; transform:translateY(-50%);
      width:16px; height:16px; color:var(--text-muted); }

    /* List */
    #vault-list { display:flex; flex-direction:column; gap:8px; }
    .item { display:flex; align-items:center; gap:12px; padding:12px 14px; background:var(--bg-card);
      border:1px solid var(--border-dim); border-radius:var(--radius-md); cursor:pointer; transition:all .12s; }
    .item:hover { border-color:var(--border-glow); background:var(--bg-surface); }
    .mono-icon { width:38px; height:38px; border-radius:10px; display:grid; place-items:center;
      font-weight:700; font-size:16px; color:#fff; flex-shrink:0; }
    .item-main { min-width:0; flex:1; }
    .item-title { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .item-sub { color:var(--text-secondary); font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .item-actions { display:flex; gap:4px; opacity:0; transition:opacity .12s; }
    .item:hover .item-actions { opacity:1; }
    .empty { text-align:center; color:var(--text-muted); padding:40px 0; }

    /* Template grid */
    .tmpl-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:10px; margin-top:6px;
      max-height:52vh; overflow:auto; padding:2px; }
    .tmpl { display:flex; flex-direction:column; align-items:center; gap:7px; padding:12px 6px;
      background:var(--bg-elevated); border:1px solid var(--border-dim); border-radius:var(--radius-md);
      cursor:pointer; transition:all .12s; }
    .tmpl:hover { border-color:var(--accent-dim); transform:translateY(-1px); }
    .tmpl span { font-size:12px; color:var(--text-secondary); }

    /* Password toolbox */
    .pw-row { display:flex; gap:8px; }
    .pw-row input { flex:1; }
    .gen-panel { background:var(--bg-input); border:1px solid var(--border-dim); border-radius:var(--radius-md);
      padding:12px; margin-top:8px; }
    .gen-panel .opt { display:flex; align-items:center; gap:8px; margin:6px 0; font-size:13px; color:var(--text-secondary); }
    .gen-panel input[type=range] { flex:1; accent-color:var(--accent); }
    .gen-panel input[type=checkbox] { width:auto; accent-color:var(--accent); }
    .chips { display:flex; gap:8px; flex-wrap:wrap; }
    .strength { height:6px; border-radius:3px; background:var(--bg-elevated); overflow:hidden; margin-top:8px; }
    .strength > i { display:block; height:100%; width:0; transition:width .2s,background .2s; }

    /* Detail rows */
    .detail-row { display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--border-dim); }
    .detail-row:last-child { border-bottom:none; }
    .detail-row .k { font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; width:96px; flex-shrink:0; }
    .detail-row .v { flex:1; min-width:0; word-break:break-all; }
    .totp-code { font-family:var(--font-mono); font-size:22px; letter-spacing:3px; color:var(--accent); }
    .totp-ring { font-size:12px; color:var(--text-muted); }
    .code-box { font-family:var(--font-mono); font-size:19px; letter-spacing:2px; background:var(--bg-void);
      border:1px dashed var(--accent-dim); border-radius:var(--radius-md); padding:15px; text-align:center;
      margin:14px 0; user-select:all; color:var(--accent); }

    /* Overlays */
    #modal,#busy { position:fixed; inset:0; background:rgba(3,5,10,.72); backdrop-filter:blur(3px);
      display:flex; justify-content:center; align-items:flex-start; padding:6vh 16px; z-index:30; overflow:auto; }
    #busy { align-items:center; }
    .spinner { width:34px; height:34px; border:3px solid var(--border-mid); border-top-color:var(--accent);
      border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 12px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); padding:11px 18px;
      border-radius:var(--radius-md); background:var(--bg-elevated); border:1px solid var(--border-mid);
      z-index:40; max-width:90%; box-shadow:0 6px 30px rgba(0,0,0,.4); }
    .toast.err { border-color:var(--red); color:var(--red); }
    .toast.ok { border-color:var(--accent); color:var(--accent); }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- Onboarding -->
    <section id="screen-onboarding" class="screen">
      <div class="card">
        <div class="brand"><span class="logo">🔐</span><h1>Tresor einrichten</h1></div>
        <p class="muted" style="margin-bottom:6px">Zero-Knowledge — dein Master-Passwort verlässt niemals dieses Gerät.</p>
        <label class="field"><span>Benutzername</span><input id="ob-username" autocomplete="username"></label>
        <label class="field"><span>Master-Passwort</span><input id="ob-password" type="password" autocomplete="new-password"></label>
        <label class="field"><span>Master-Passwort wiederholen</span><input id="ob-password2" type="password" autocomplete="new-password"></label>
        <button id="ob-submit" class="btn primary" style="width:100%;justify-content:center;margin-top:8px">Konto erstellen</button>
        <div class="row mt"><span class="dim">Schon ein Konto?</span><button id="to-login" class="link">Anmelden</button></div>
      </div>
    </section>

    <!-- Login -->
    <section id="screen-login" class="screen" hidden>
      <div class="card">
        <div class="brand"><span class="logo">🔐</span><h1>Anmelden</h1></div>
        <label class="field"><span>Benutzername</span><input id="li-username" autocomplete="username"></label>
        <label class="field"><span>Master-Passwort</span><input id="li-password" type="password" autocomplete="current-password"></label>
        <button id="li-submit" class="btn primary" style="width:100%;justify-content:center;margin-top:8px">Anmelden</button>
        <div class="row mt"><span class="dim">Neu hier?</span><button id="to-onboarding" class="link">Konto erstellen</button></div>
      </div>
    </section>

    <!-- Warten auf iPhone-Freigabe -->
    <section id="screen-wait" class="screen" hidden>
      <div class="card" style="text-align:center">
        <div class="spinner"></div>
        <h2>Warte auf iPhone-Freigabe</h2>
        <p class="muted">Bestätige die Anmeldung auf deinem iPhone. Abgleich-Code:</p>
        <div class="code-box" id="li-wait-code">–</div>
        <button id="li-cancel-wait" class="link">Abbrechen</button>
      </div>
    </section>

    <!-- Tresor -->
    <section id="screen-vault" class="screen" hidden style="display:block">
      <div class="topbar">
        <h1 class="grow"><span class="logo" style="width:30px;height:30px;border-radius:8px;display:inline-grid">🔐</span> Tresor</h1>
        <button id="btn-add" class="btn primary">+ Eintrag</button>
        <button id="btn-gen" class="btn">🎲 Generator</button>
        <button id="btn-pair" class="btn">📱 Geräte</button>
        <button id="btn-lock" class="btn">Sperren</button>
      </div>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
        <input id="search" placeholder="Suchen…">
      </div>
      <div id="vault-list"></div>
    </section>
  </div>

  <div id="modal" hidden></div>
  <div id="busy" hidden><div style="text-align:center"><div class="spinner"></div><div id="busy-msg" class="muted"></div></div></div>
  <div id="toast" class="toast" hidden></div>

  <script type="module" src="./app.js?v=3"></script>
</body>
</html>
